name: Data Validation

on:
  push:
    paths:
      - 'public/data/**'
      - 'scripts/validate_data.py'
  pull_request:
    paths:
      - 'public/data/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run data validation
        run: python3 scripts/validate_data.py
